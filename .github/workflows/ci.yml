# CI : un seul job `checks` (le nom est exigé par la protection de main, .github/rulesets/main.json).
# Les contrôles vivent dans tools/ci/checks.sh, lancé aussi en local par tools/ci/ci_locale.sh <n°>
# (même verdict). Sans minutes Actions : `gh workflow disable CI` et tout passe en local.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Contrôles
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tools/ci/checks.sh "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
