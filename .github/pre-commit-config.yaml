# Contrôles avant chaque commit. Une fois par clone :
#   pipx install pre-commit && pre-commit install -c .github/pre-commit-config.yaml
# Tout lancer : pre-commit run --all-files -c .github/pre-commit-config.yaml
# Ajouter ici le linter du langage du projet (ruff, eslint, gofmt…).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict        # macOS ne distingue pas Fig.png de fig.png
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=5000"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
